<!doctype html>
<html lang="en" class="h-full" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0c0b" />
    <meta name="description" content="PetroFlow ERP — Multi-outlet petrol pump operations, stock, shift reconciliation and credit control" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Resolve the theme before first paint so the app never flashes the wrong palette. -->
    <script>
      (function () {
        var theme = 'dark';
        try {
          var saved = localStorage.getItem('petroflow.theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
        } catch (error) {
          /* Private mode / storage disabled — keep the dark default. */
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        var themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) themeColor.setAttribute('content', theme === 'dark' ? '#0a0c0b' : '#f4f3ef');
      })();
    </script>

    <title>PetroFlow ERP — Fuel Station Operations Platform</title>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
