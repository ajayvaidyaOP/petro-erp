<!doctype html>
<html lang="en" class="h-full" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f6fc" />
    <meta name="description" content="PetroFlow ERP — Multi-outlet petrol pump operations, stock, shift reconciliation and credit control" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Resolve the theme before first paint so the app never flashes the wrong palette. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('petroflow.theme');
          var theme = saved === 'light' || saved === 'dark' ? saved : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          /* private mode / storage disabled — use the light default */
        }
      })();
    </script>

    <title>PetroFlow ERP — Fuel Station Operations Platform</title>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
