name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Database isolation (see the "Database isolation" step in each job):
#   * verify  -> petroflow_test  (suffix _test is enforced by the Java suite itself)
#   * e2e     -> petroflow_e2e   (suffix _e2e)
#   * the production schema name "petroflow" is never created, referenced or connected to.
# Every job step connects with the unprivileged CI user below; no job step receives root
# credentials. The MySQL service container needs an initial root password to start, which is
# declared only in the service definition and never exported to a step.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          # Container-initialisation only; this account is never handed to a job step.
          MYSQL_ROOT_PASSWORD: ci-local-root
          MYSQL_DATABASE: petroflow_test
          MYSQL_USER: petroflow_ci
          MYSQL_PASSWORD: petroflow_ci_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-local-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    env:
      NODE_ENV: development
      PETROFLOW_DB_HOST: 127.0.0.1
      PETROFLOW_DB_PORT: '3306'
      PETROFLOW_DB_NAME: petroflow_test
      PETROFLOW_DB_USER: petroflow_ci
      PETROFLOW_DB_PASSWORD: petroflow_ci_pw
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_DATABASE: petroflow_test
      MYSQL_USER: petroflow_ci
      MYSQL_PASSWORD: petroflow_ci_pw
      TEST_DB_NAME: petroflow_test
      SEED_DEMO_DATA: 'true'
      ENABLE_DEMO_TOOLS: 'true'
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install frontend & test dependencies
        run: npm ci

      - name: Database isolation guard (test schema only, never "petroflow")
        run: |
          set -euo pipefail
          if [ "$PETROFLOW_DB_NAME" = "petroflow" ]; then
            echo "Refusing to run CI against the production schema name." >&2
            exit 1
          fi
          case "$PETROFLOW_DB_NAME" in
            *_test|*_e2e) ;;
            *) echo "CI database must end in _test or _e2e (got $PETROFLOW_DB_NAME)" >&2; exit 1 ;;
          esac
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" \
            -e "SELECT DATABASE(), CURRENT_USER();" "$PETROFLOW_DB_NAME"
          # The API bootstraps its pool with CREATE DATABASE IF NOT EXISTS; prove the grant works.
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" \
            -e "CREATE DATABASE IF NOT EXISTS \`$PETROFLOW_DB_NAME\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" \
            -e "SHOW DATABASES;" | grep -qx "$PETROFLOW_DB_NAME"

      - name: Typecheck frontend & compile Java 21 backend
        run: npm run typecheck

      - name: Java 21 unit + MySQL HTTP integration tests
        run: npm test

      - name: Build frontend assets & package Java API jar
        run: npm run build

      - name: MySQL schema, seed & mysqldump smoke test (test schema only)
        run: |
          set -euo pipefail
          npm run db:seed
          mysqldump --no-tablespaces -h "$MYSQL_HOST" -P "$MYSQL_PORT" \
            -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" "$PETROFLOW_DB_NAME" > /tmp/petroflow-backup.sql
          test -s /tmp/petroflow-backup.sql

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    services:
      mysql:
        image: mysql:8.0
        env:
          # Container-initialisation only; this account is never handed to a job step.
          MYSQL_ROOT_PASSWORD: ci-local-root
          MYSQL_DATABASE: petroflow_e2e
          MYSQL_USER: petroflow_e2e
          MYSQL_PASSWORD: petroflow_e2e_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-local-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    env:
      NODE_ENV: development
      PETROFLOW_DB_HOST: 127.0.0.1
      PETROFLOW_DB_PORT: '3306'
      PETROFLOW_DB_NAME: petroflow_e2e
      PETROFLOW_DB_USER: petroflow_e2e
      PETROFLOW_DB_PASSWORD: petroflow_e2e_pw
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_DATABASE: petroflow_e2e
      MYSQL_USER: petroflow_e2e
      MYSQL_PASSWORD: petroflow_e2e_pw
      E2E_MYSQL_DATABASE: petroflow_e2e
      SEED_DEMO_DATA: 'true'
      ENABLE_DEMO_TOOLS: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - run: npm ci

      - name: Database isolation guard (e2e schema only, never "petroflow")
        run: |
          set -euo pipefail
          if [ "$MYSQL_DATABASE" = "petroflow" ] || [ "$MYSQL_DATABASE" = "petroflow_test" ]; then
            echo "Refusing to run E2E against $MYSQL_DATABASE." >&2
            exit 1
          fi
          case "$MYSQL_DATABASE" in
            *_e2e) ;;
            *) echo "E2E database must end in _e2e (got $MYSQL_DATABASE)" >&2; exit 1 ;;
          esac
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" \
            -e "SELECT DATABASE(), CURRENT_USER();" "$MYSQL_DATABASE"
          # Playwright starts the API jar with --reset-db; prove that grant exists before the run.
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" \
            -e "CREATE DATABASE IF NOT EXISTS \`$MYSQL_DATABASE\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Package Java 21 API jar
        run: node scripts/gradle.mjs jar --no-daemon

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser workflows (React/Vite + Java 21 API + MySQL 8)
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
