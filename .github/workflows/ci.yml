name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Database isolation (see the "Database isolation" step in each job):
#   * verify  -> petroflow_test  (suffix _test is enforced by the Java suite itself)
#   * e2e     -> petroflow_e2e   (suffix _e2e)
#   * the production schema name "petroflow" is never created, referenced or connected to.
# Every job step connects with the unprivileged CI user below; no job step receives root
# credentials. The MySQL service container needs an initial root password to start, which is
# declared only in the service definition and never exported to a step.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: petroflow
          MYSQL_DATABASE: petroflow_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-local-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    env:
      NODE_ENV: development
      PETROFLOW_DB_HOST: 127.0.0.1
      PETROFLOW_DB_PORT: '3306'
      PETROFLOW_DB_NAME: petroflow_test
      PETROFLOW_DB_USER: petroflow_ci
      PETROFLOW_DB_PASSWORD: petroflow_ci_pw
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_DATABASE: petroflow_test
      MYSQL_USER: petroflow_test_app
      MYSQL_PASSWORD: petroflow_test_only
      TEST_DB_NAME: petroflow_test
      PETROFLOW_TEST_DB_DISPOSABLE: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Provision disposable schemas and scoped test principal (administrator only)
        env:
          MYSQL_ROOT_PASSWORD: petroflow
        run: |
          MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -h 127.0.0.1 -P 3306 -u root <<'SQL'
          CREATE DATABASE IF NOT EXISTS petroflow_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          CREATE USER IF NOT EXISTS 'petroflow_test_app'@'%' IDENTIFIED BY 'petroflow_test_only';
          -- This fresh job service creates the account; no roles are granted.
          -- Only petroflow_test is required by db:seed, the backend suite, and mysqldump.
          -- Schema DDL/reset requires CREATE, ALTER, DROP, INDEX, REFERENCES; app data uses CRUD.
          GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, DROP, INDEX, REFERENCES ON petroflow_test.* TO 'petroflow_test_app'@'%';
          SHOW GRANTS FOR 'petroflow_test_app'@'%';
          SELECT user, host, Create_priv, Drop_priv, Grant_priv, File_priv, Process_priv, Super_priv
            FROM mysql.user WHERE user='petroflow_test_app';
          SQL
          grants="$(MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -N -h 127.0.0.1 -P 3306 -u root -e "SHOW GRANTS FOR 'petroflow_test_app'@'%'")"
          printf '%s\n' "$grants"
          if printf '%s\n' "$grants" | grep -F 'ON *.*' | grep -vF 'GRANT USAGE ON *.*'; then
            echo 'Unexpected global privilege on test application account' >&2
            exit 1
          fi
          if printf '%s\n' "$grants" | grep -E '^GRANT .* TO ' | grep -v ' ON '; then
            echo 'Unexpected role grant on test application account' >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install frontend & test dependencies
        run: npm ci

      - name: MySQL schema and seed smoke test (pre-created disposable test schema)
        run: npm run db:seed

      - name: Typecheck frontend & compile Java 21 backend
        run: npm run typecheck

      - name: Java 21 unit + MySQL HTTP integration tests
        run: npm test

      - name: Build frontend assets & package Java API jar
        run: npm run build

      - name: MySQL mysqldump smoke test (disposable test schema)
        run: |
          MYSQL_PWD="$MYSQL_PASSWORD" mysqldump --single-transaction --no-tablespaces -h 127.0.0.1 -P 3306 -u "$MYSQL_USER" petroflow_test > /tmp/petroflow-test-backup.sql
          test -s /tmp/petroflow-test-backup.sql

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    services:
      mysql:
        image: mysql:8.0
        env:
          # Container-initialisation only; this account is never handed to a job step.
          MYSQL_ROOT_PASSWORD: ci-local-root
          MYSQL_DATABASE: petroflow_e2e
          MYSQL_USER: petroflow_e2e
          MYSQL_PASSWORD: petroflow_e2e_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-local-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    env:
      NODE_ENV: development
      PETROFLOW_DB_HOST: 127.0.0.1
      PETROFLOW_DB_PORT: '3306'
      PETROFLOW_DB_NAME: petroflow_e2e
      PETROFLOW_DB_USER: petroflow_e2e
      PETROFLOW_DB_PASSWORD: petroflow_e2e_pw
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_DATABASE: petroflow_e2e
      MYSQL_USER: petroflow_e2e
      MYSQL_PASSWORD: petroflow_e2e_pw
      E2E_MYSQL_DATABASE: petroflow_e2e
      MYSQL_USER: petroflow_e2e_app
      MYSQL_PASSWORD: petroflow_e2e_only
    steps:
      - uses: actions/checkout@v4

      - name: Provision E2E-scoped principal (administrator only)
        env:
          MYSQL_ROOT_PASSWORD: petroflow
        run: |
          MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -h 127.0.0.1 -P 3306 -u root <<'SQL'
          CREATE DATABASE IF NOT EXISTS petroflow_e2e CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          CREATE USER IF NOT EXISTS 'petroflow_e2e_app'@'%' IDENTIFIED BY 'petroflow_e2e_only';
          -- Same schema-local DDL and CRUD privileges; no global or production grants.
          GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, DROP, INDEX, REFERENCES ON petroflow_e2e.* TO 'petroflow_e2e_app'@'%';
          SHOW GRANTS FOR 'petroflow_e2e_app'@'%';
          SQL
          grants="$(MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -N -h 127.0.0.1 -P 3306 -u root -e "SHOW GRANTS FOR 'petroflow_e2e_app'@'%'")"
          printf '%s\n' "$grants"
          if printf '%s\n' "$grants" | grep -F 'ON *.*' | grep -vF 'GRANT USAGE ON *.*'; then
            echo 'Unexpected global privilege on E2E application account' >&2
            exit 1
          fi
          if printf '%s\n' "$grants" | grep -E '^GRANT .* TO ' | grep -v ' ON '; then
            echo 'Unexpected role grant on E2E application account' >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - run: npm ci

      - name: Database isolation guard (e2e schema only, never "petroflow")
        run: |
          set -euo pipefail
          if [ "$MYSQL_DATABASE" = "petroflow" ] || [ "$MYSQL_DATABASE" = "petroflow_test" ]; then
            echo "Refusing to run E2E against $MYSQL_DATABASE." >&2
            exit 1
          fi
          case "$MYSQL_DATABASE" in
            *_e2e) ;;
            *) echo "E2E database must end in _e2e (got $MYSQL_DATABASE)" >&2; exit 1 ;;
          esac
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" \
            -e "SELECT DATABASE(), CURRENT_USER();" "$MYSQL_DATABASE"
          # Playwright starts the API jar with --reset-db; prove that grant exists before the run.
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" \
            -e "CREATE DATABASE IF NOT EXISTS \`$MYSQL_DATABASE\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Package Java 21 API jar
        run: node scripts/gradle.mjs jar --no-daemon

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser workflows (React/Vite + Java 21 API + MySQL 8)
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
